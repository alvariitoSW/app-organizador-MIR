<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Buscar alimentos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#070b14}
a{color:#38e1ff}a:hover{color:#7fefff}
button,input{font:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1040px; box-sizing: border-box; background: #070b14; color: #e9f2ff; font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; padding-bottom: 20px">

  <div style="display: flex; align-items: center; gap: 8px; padding: 14px 16px 0">
    <a href="Hoy.dc.html" aria-label="Volver a Hoy" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #1e2b44; background: #0d1526; color: #e9f2ff; display: flex; align-items: center; justify-content: center; flex: none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div style="flex: 1; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 12px; border-radius: 14px; border: 1px solid #38e1ff; background: #0d1a2b">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8fa6c6" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <label for="q" style="position: absolute; left: -9999px">Buscar alimento, receta o producto</label>
      <input id="q" value="salmón" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #e9f2ff; font-size: 16px; outline: none">
      <button aria-label="Borrar la búsqueda" style="width: 32px; height: 32px; border-radius: 50%; border: 0; background: #1e2b44; color: #c7d6ec; display: flex; align-items: center; justify-content: center">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 8px; padding: 12px 16px 0; font-size: 13px">
    <span style="color: #8fa6c6">Añadir a</span>
    <button style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #1e2b44; background: #111a2b; color: #e9f2ff; font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px">Cena · hoy
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <span style="flex: 1"></span>
    <button aria-label="Escanear código de barras" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #1e2b44; background: #111a2b; color: #e9f2ff; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7V5h3M17 5h3v2M20 17v2h-3M7 19H4v-2M8 9v6M11 9v6M14 9v6M17 9v6"/></svg>
    </button>
  </div>

  <div style="display: flex; gap: 6px; padding: 12px 16px 0; flex-wrap: wrap">
    <button aria-pressed="true" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #38e1ff; background: #0d2433; color: #e9f2ff; font-weight: 700; font-size: 13px">Todo · 9</button>
    <button aria-pressed="false" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #1e2b44; background: #111a2b; color: #c7d6ec; font-weight: 700; font-size: 13px">Recetas · 2</button>
    <button aria-pressed="false" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #1e2b44; background: #111a2b; color: #c7d6ec; font-weight: 700; font-size: 13px">Alimentos · 3</button>
    <button aria-pressed="false" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #1e2b44; background: #111a2b; color: #c7d6ec; font-weight: 700; font-size: 13px">Compro · 2</button>
    <button aria-pressed="false" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #1e2b44; background: #111a2b; color: #c7d6ec; font-weight: 700; font-size: 13px">Fuera · 2</button>
  </div>

  <span style="padding: 18px 16px 6px; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: #8fa6c6">TUS RECETAS</span>
  <div style="margin: 0 16px; border-radius: 16px; border: 1px solid #1e2b44; background: #111a2b; padding: 0 6px 0 15px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 0">
      <a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; min-width: 0; color: #e9f2ff; text-decoration: none">
        <span style="font-weight: 700">Salmón al horno con patata y espárragos</span>
        <span style="font-size: 12.5px; color: #8fa6c6">1 ración · <b style="color: #e9f2ff">540 kcal</b> · <b style="color: #38e1ff">36 g P</b></span>
      </a>
      <button aria-label="Añadir una ración a la cena" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #0d2433; color: #38e1ff; font-size: 22px; flex: none">+</button>
    </div>
  </div>

  <span style="padding: 18px 16px 6px; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: #8fa6c6">ALIMENTOS</span>
  <div style="margin: 0 16px; border-radius: 16px; border: 1px solid #1e2b44; background: #111a2b; padding: 0 6px 0 15px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 0">
      <a href="Alimento.dc.html" style="flex: 1; display: flex; flex-direction: column; min-width: 0; color: #e9f2ff; text-decoration: none">
        <span style="font-weight: 700">Salmón <span style="font-weight: 400; color: #8fa6c6">· crudo</span></span>
        <span style="font-size: 12.5px; color: #8fa6c6">100 g · <b style="color: #e9f2ff">208 kcal</b> · <b style="color: #38e1ff">20 g P</b> · 13 g G</span>
      </a>
      <button aria-label="Añadir salmón" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #0d2433; color: #38e1ff; font-size: 22px; flex: none">+</button>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid #1a2640">
      <div style="flex: 1; display: flex; flex-direction: column; min-width: 0">
        <span style="font-weight: 700">Salmón ahumado</span>
        <span style="font-size: 12.5px; color: #8fa6c6">[ración] · [kcal] · [P]</span>
      </div>
      <button aria-label="Añadir salmón ahumado" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #0d2433; color: #38e1ff; font-size: 22px; flex: none">+</button>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; padding: 10px 0; border-top: 1px solid #1a2640">
      <button style="min-height: 36px; border: 0; background: transparent; color: #8fa6c6; font-weight: 700; font-size: 13px">ver los 3</button>
    </div>
  </div>

  <span style="padding: 18px 16px 6px; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: #8fa6c6">COMER FUERA</span>
  <div style="margin: 0 16px; border-radius: 16px; border: 1px solid #1e2b44; background: #111a2b; padding: 0 6px 0 15px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 0">
      <div style="flex: 1; display: flex; flex-direction: column; min-width: 0">
        <span style="font-weight: 700">Poke de salmón</span>
        <span style="font-size: 12.5px; color: #8fa6c6">1 bol · <b style="color: #e9f2ff">600 kcal</b> · <b style="color: #38e1ff">30 g P</b> · estimado</span>
      </div>
      <button aria-label="Añadir poke de salmón" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #0d2433; color: #38e1ff; font-size: 22px; flex: none">+</button>
    </div>
  </div>

  <div style="flex: 1"></div>

  <div style="margin: 18px 16px 0; padding: 12px 15px; border-radius: 16px; border: 1px dashed #2a3b5c; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13.5px; color: #c7d6ec">¿No está lo que buscas?</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button style="min-height: 44px; border-radius: 12px; border: 1px solid #1e2b44; background: #111a2b; color: #e9f2ff; font-weight: 700; font-size: 13px">Buscar en Open Food Facts</button>
      <button style="min-height: 44px; border-radius: 12px; border: 1px solid #1e2b44; background: #111a2b; color: #e9f2ff; font-weight: 700; font-size: 13px">Crear alimento</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
