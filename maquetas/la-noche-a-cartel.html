<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Noche · A · El cartel</title><link rel="stylesheet" href="la-noche-comun.css"><style>
.cartel{background:#05070c;border:2px solid #1d2433;border-radius:14px;padding:10px 14px;box-shadow:inset 0 0 18px rgba(0,0,0,.8)}
.led{font-family:ui-monospace,Menlo,monospace;color:#ffc94a;text-shadow:0 0 6px rgba(255,190,60,.55);text-transform:uppercase;letter-spacing:1px}
.led .l1{font-size:13px;opacity:.85}.led .l2{font-size:27px;font-weight:700;line-height:1.15}.led .l3{font:13px/1.3 system-ui,sans-serif;color:#ffe9b8;text-transform:none;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sobre{position:absolute;left:12px;right:12px;top:12px}
.esc{position:relative}
.chips{display:flex;gap:6px;align-items:center;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;cursor:pointer}
.chip{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}.chip+.chip:before{content:"›";color:var(--ink2);margin-right:6px}.mas{margin-left:auto;color:var(--ink2)}.chip small{color:var(--ink2);font-size:11px}
</style></head>
<body><div id="tel"></div>
<div class="mandos"><h2>Para navegar</h2>
<div>Hora simulada: <b id="reloj"></b></div>
<div class="row"><button data-a="t-10">−10 min</button><button data-a="t+10">+10 min</button></div>
<div class="row"><button data-a="ir-20:05">20:05</button><button data-a="ir-21:20">21:20</button><button data-a="ir-22:25">22:25</button><button data-a="ir-01:10">01:10</button><button data-a="ir-07:17">07:17</button><button data-a="ir-07:50">07:50</button></div>
<div>Cama esta noche: <b id="cama"></b> (adelanto de 15 min cada 3 días)</div>
<div class="row"><button data-a="cama-">más tarde</button><button data-a="cama+">más pronto</button><button data-a="sug">día de cambio (sugerencia)</button></div>
<div class="row"><button data-a="alarmas">⏰ pantalla de alarmas</button><button data-a="semana">📊 la semana</button><button data-a="borra">borrar vuelta/llegada</button></div>
</div>
<script src="la-noche-comun.js"></script><script>
function cartel(G){return "<div class=\"cartel led\"><div class=\"l1\">"+(G.ico||"")+" "+(G.h?G.h.cartel:"")+(G.hora?" · "+G.hora:"")+"</div><div class=\"l2\">"+(G.min!=null?"en "+falta(G.min):G.txt)+"</div><div class=\"l3\">"+(G.sub||"")+"</div></div>";}
function chips(C){if(S.abierta)return "<button class=\"b s\" style=\"margin-top:10px\" data-a=\"plegar\">▴ plegar</button>";const P=pendientes(C).slice(1,5);return "<div class=\"chips\" data-a=\"plegar\">"+P.map(h=>"<span class=\"chip\">"+h.ico+" "+HM(h.hora)+(h.id==="desp"?" <small>fijo</small>":"")+"</span>").join("")+"<span class=\"mas\">"+(S.abierta?"▴":"▾")+"</span></div>";}
function pintaArriba(S,C){const G=grande(C),B=botonVivo(C);
  const viv=B?"<button class=\"b p vivo\" data-a=\""+B.k+"\">"+B.txt+"</button>":"";
  if(S.modo==="conductor")return "<div class=\"esc\">"+escena(250)+"<div class=\"sobre\">"+cartel(G)+"</div></div>"+viv+chips(C)+(S.abierta?cadenaAbierta(C):"");
  return cartel(G)+viv+chips(C)+(S.abierta?cadenaAbierta(C):"");}
</script></body></html>
