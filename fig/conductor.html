<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tu ruta de hoy</title>
<!-- «Hoy» desde el asiento del conductor (maqueta). Por el parabrisas, la calle: cada cosa del día es una
     parada con su marquesina y su letrero, en el orden en que llegan; según pasa la hora el autobús va
     de una a otra. En el salpicadero, lo que hay que leer de un vistazo: la próxima parada, lo de ahora y
     hasta cuándo, la hora y el depósito de «sueño» (lo que dormiste anoche frente a tu objetivo). De
     noche el autobús está en la cochera con la persiana bajada; al despertar sube y sales a la calle.
     El día puede llegar en la dirección: #d=[{a,b,t,k}…]&s=7.5/8&t=10.4&sol=7/18.6&ph=2&corto -->
<style>
:root{--page:#070b14}
html,body{margin:0;background:var(--page);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body.corto{background:transparent}
.wrap{max-width:660px;margin:14px auto}
body.corto .wrap{margin:0}
svg{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
[data-open]{cursor:pointer}
/* la calle */
.ground{fill:#3b4352}.road{fill:#262c36}.walk{fill:#59616f}.walk-l{stroke:#4a5260;stroke-width:.6}.kerb-f{fill:#9aa3b2}.edge-f{fill:#cfd5df}
.dash{fill:#d8dde6}.edge{stroke:#cfd5df;stroke-width:.8;fill:none}
.bld-a{fill:#4b5a78}.bld-b{fill:#3a4763}.bld-c{fill:#5b6a8a}.bld-d{fill:#43506d}.bld-end{fill:#2e3850}
.win{fill:#1a2236}.win-on{fill:#ffd98a}
.post{stroke:#6c7686;fill:none;stroke-linecap:round}.lamp{fill:#9aa3b2}.glow{fill:#ffd98a}
.sh-roof{fill:#7f8ea6}.sh-edge{fill:#5c6b84}.sh-glass{fill:#9fd0ff;fill-opacity:.22;stroke:#b8c6da;stroke-width:.6}.sh-bench{fill:#8a6a48}
.board{fill:#0b1020;stroke:#3a4a66;stroke-width:.8}.board-on{stroke:#ffd66b;stroke-width:2}.board-t{fill:#e9f2ff;font-weight:800}.board-h{fill:#8fa6c6;font-weight:700;font-family:ui-monospace,Menlo,monospace}
.board-on .board-t,.on .board-t,.on .board-h{fill:#ffd66b}
.lv-work{fill:#d9573f}.lv-meal{fill:#2f9e6b}.lv-gym{fill:#7a5cf0}.lv-plan{fill:#1fa6c4}.lv-sleep{fill:#4a5f9e}

/* la cochera por dentro */
.g-floor{fill:#151a22}.g-ceil{fill:#0d1118}.g-wall-l{fill:#1b212b}.g-wall-r{fill:#181d26}.g-back{fill:#20262f}
.g-door{fill:#3d4859}.g-slat{stroke:#28303c;stroke-width:.8;fill:none}.g-slit{fill:#ffd98a}.g-lamp{fill:#2a3240}.g-lamp-on{fill:#ffe9b0}
/* el autobús por dentro */
.frame{fill:#0a0e16}.pillar{fill:#111724}.visor{fill:#161d2c}.seal{stroke:#1e2738;stroke-width:3;fill:none}
.mirror{fill:#0e1420;stroke:#2a3448;stroke-width:2}.mirror-g{fill:#1a2333}.mirror-t{fill:#8fa6c6;font:600 11px ui-sans-serif,system-ui,sans-serif}
.strip{fill:#05070c;stroke:#1e2738;stroke-width:1.2}.strip-l{stroke:#2a3a55;stroke-width:2}.st-dot{fill:#2a3a55}.st-done{fill:#56708f}.st-next{fill:#ffd66b}.st-bus{fill:#38e1ff}
.strip-t{fill:#5d7394;font:700 9.5px ui-monospace,Menlo,monospace;letter-spacing:.06em}
.dash-top{fill:#151c2a}.dash-face{fill:#0f1520}.dash-edge{stroke:#2a3448;stroke-width:1.5;fill:none}
.lcd{fill:#04131a;stroke:#1d3340;stroke-width:1.2}.lcd-clk{fill:#7fecff;font:700 34px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-anchor:middle}
.quedan{fill:#8fa6c6;font:700 12px ui-sans-serif,system-ui,sans-serif;text-anchor:middle}.lab{fill:#5d7394;font:800 9.5px ui-sans-serif,system-ui,sans-serif;letter-spacing:.12em}
.gauge-a{stroke:#2a3448;stroke-width:5;fill:none}.gauge-f{stroke:#5a78d0;stroke-width:5;fill:none}.gauge-tk{stroke:#5d7394;stroke-width:1.2}.gauge-obj{stroke:#38e1ff;stroke-width:2.4}
.needle{stroke:#ff6b5a;stroke-width:2.4;stroke-linecap:round}.hub{fill:#2a3448}.gauge-v{fill:#e9f2ff;font:700 13px ui-monospace,Menlo,monospace;text-anchor:middle}
.disp{fill:#060a10;stroke:#2a3448;stroke-width:1.4}.nx-l{fill:#b98c2c;font:800 10px ui-sans-serif,system-ui,sans-serif;letter-spacing:.14em}
.nx-b{fill:#ffd66b;font:800 25px ui-sans-serif,system-ui,sans-serif}.nx-a{fill:#e9f2ff;font:600 14.5px ui-sans-serif,system-ui,sans-serif}.nx-a b{font-weight:800}
.wheel{stroke:#263044;stroke-width:22;fill:none}.wheel-hi{stroke:#3a4a66;stroke-width:2;fill:none}.spoke{fill:#222b3d}.horn{fill:#2c374d}
.tk-box{fill:#1b2333;stroke:#2a3448;stroke-width:1.2}.tk-paper{fill:#f3efe4}.tk-t{fill:#1d2b40;font:800 11px ui-sans-serif,system-ui,sans-serif}.tk-led{fill:#38e1ff}
.toast{fill:#0d1726;stroke:#38e1ff;stroke-width:1.2}.toast-t{fill:#e9f2ff;font:700 13px ui-sans-serif,system-ui,sans-serif;text-anchor:middle}
.tap{fill:transparent}
</style>
</head>
<body>
<div class="wrap">
<svg id="cab" viewBox="0 0 600 440" role="slider" tabindex="0" aria-label="Tu día desde el asiento del conductor: las paradas son lo que toca hoy. Arrastra a lo ancho para mover la hora; las flechas, de cuarto en cuarto." aria-valuemin="0" aria-valuemax="24">
  <defs>
    <clipPath id="win"><path d="M44 52 Q300 40 556 52 L572 266 Q300 284 28 266 Z"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop id="sky0" offset="0" stop-color="#5aa0e0"/><stop id="sky1" offset="1" stop-color="#bfe0ff"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff3c4" stop-opacity=".42"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/></linearGradient>
  </defs>
  <!-- por el parabrisas -->
  <g clip-path="url(#win)">
    <rect x="0" y="0" width="600" height="300" fill="url(#sky)"/>
    <g id="stars"></g>
    <g id="scene"></g>
    <g id="garage"></g>
  </g>
  <!-- el marco del parabrisas, el parasol, el retrovisor y la línea de hoy -->
  <path class="frame" fill-rule="evenodd" d="M0 0H600V300H0Z M44 52 Q300 40 556 52 L572 266 Q300 284 28 266 Z"/>
  <path class="seal" d="M44 52 Q300 40 556 52 L572 266 Q300 284 28 266 Z"/>
  <path class="pillar" d="M0 40 L44 52 L28 266 L0 300Z"/><path class="pillar" d="M600 40 L556 52 L572 266 L600 300Z"/>
  <path class="visor" d="M60 50 Q150 44 236 47 L232 74 Q150 72 66 76 Z"/>
  <g data-open="atras">
    <rect class="mirror" x="250" y="50" width="100" height="30" rx="9"/><rect class="mirror-g" x="255" y="54.5" width="90" height="21" rx="6"/>
    <text id="mir" class="mirror-t" x="300" y="69" text-anchor="middle"></text>
    <rect x="296" y="40" width="8" height="11" rx="2" class="pillar"/>
  </g>
  <g>
    <rect class="strip" x="40" y="8" width="520" height="28" rx="7"/>
    <text class="strip-t" x="52" y="25.5">LÍNEA DE HOY</text>
    <g id="route"></g>
  </g>
  <!-- el salpicadero -->
  <path class="dash-top" d="M0 300 Q300 278 600 300 V440 H0Z"/>
  <path class="dash-edge" d="M0 300 Q300 278 600 300"/>
  <g data-open="sueno">
    <rect class="lcd" x="34" y="306" width="232" height="88" rx="14"/>
    <text class="lab" x="48" y="324">HORA</text>
    <text id="clk" class="lcd-clk" x="104" y="364">10:24</text>
    <text id="quedan" class="quedan" x="104" y="384"></text>
    <text class="lab" x="176" y="324">SUEÑO</text>
    <path class="gauge-a" d="M184 378 A38 38 0 0 1 252 378"/>
    <path id="gfill" class="gauge-f" d=""/>
    <g id="gticks"></g>
    <path id="gobj" class="gauge-obj" d=""/>
    <line id="needle" class="needle" x1="218" y1="378" x2="218" y2="346"/>
    <circle class="hub" cx="218" cy="378" r="4.5"/>
    <text id="gval" class="gauge-v" x="218" y="390"></text>
  </g>
  <g data-open="proxima">
    <rect class="disp" x="278" y="306" width="290" height="88" rx="14"/>
    <text id="nxl" class="nx-l" x="294" y="326">PRÓXIMA PARADA</text>
    <text id="nxb" class="nx-b" x="294" y="356"></text>
    <text id="nxa" class="nx-a" x="294" y="381"></text>
  </g>
  <g data-open="parahoy">
    <rect class="tk-box" x="452" y="404" width="124" height="34" rx="8"/>
    <rect class="tk-paper" x="462" y="398" width="104" height="22" rx="2"/>
    <text id="tk" class="tk-t" x="514" y="413.5" text-anchor="middle">PARA HOY · 2</text>
    <circle class="tk-led" cx="466" cy="430" r="2.4"/><circle cx="476" cy="430" r="2.4" fill="#2a3448"/>
  </g>
  <!-- el volante, delante de todo -->
  <g>
    <circle class="wheel" cx="160" cy="532" r="118"/>
    <circle class="wheel-hi" cx="160" cy="532" r="129"/>
    <path class="spoke" d="M60 470 Q160 444 260 470 L250 488 Q160 466 70 488Z"/>
    <circle class="horn" cx="160" cy="520" r="44"/>
  </g>
  <g id="toast" style="display:none"><rect class="toast" x="170" y="232" width="260" height="30" rx="15"/><text id="toastt" class="toast-t" x="300" y="252"></text></g>
</svg>
</div>
<script>
(function () {
  /* ---------- el día (en la app sale de la agenda de Hoy) ---------- */
  let DIA = [
    { a: 0, b: 6.75, t: "DORMIR", k: "sleep" },
    { a: 6.75, b: 7.25, t: "DESAYUNO", k: "meal" },
    { a: 8, b: 15, t: "TRABAJO UMI", k: "work" },
    { a: 15.17, b: 15.75, t: "COMIDA", k: "meal" },
    { a: 17.5, b: 18.75, t: "GYM FUERZA", k: "gym" },
    { a: 19.25, b: 19.75, t: "CENA", k: "meal" },
    { a: 20, b: 22.17, t: "LLORETAZO", k: "plan" },
    { a: 22.67, b: 30.75, t: "A DORMIR", k: "sleep" },
  ];
  let SUENO = { h: 7, obj: 8 }, SOL = [7, 18.6], PH = 2;
  const H = location.hash;
  const m = (re) => re.exec(H);
  if (m(/[#&]d=([^&]+)/)) try { DIA = JSON.parse(decodeURIComponent(m(/[#&]d=([^&]+)/)[1])); } catch (e) {}
  if (m(/[#&]s=([0-9.]+)\/([0-9.]+)/)) { const r = m(/[#&]s=([0-9.]+)\/([0-9.]+)/); SUENO = { h: +r[1], obj: +r[2] }; }
  if (m(/[#&]sol=([0-9.]+)\/([0-9.]+)/)) { const r = m(/[#&]sol=([0-9.]+)\/([0-9.]+)/); SOL = [+r[1], +r[2]]; }
  if (m(/[#&]ph=([0-9]+)/)) PH = +m(/[#&]ph=([0-9]+)/)[1];
  const HT = m(/[#&]t=([0-9.]+)/), VIVO = /[#&]vivo(&|$)/.test(H), CARGA = Date.now();
  let EMBEBIDO = false; try { EMBEBIDO = window.parent !== window && !!window.parent.PG; } catch (e) {}
  if (/[#&]corto(&|$)/.test(H)) document.body.classList.add("corto");

  const $ = (id) => document.getElementById(id), svg = $("cab");
  const still = matchMedia("(prefers-reduced-motion: reduce)");
  const hhmm = (h) => { const mm = Math.round(((h % 24) + 24) % 24 * 60) % 1440; return String(Math.floor(mm / 60)).padStart(2, "0") + ":" + String(mm % 60).padStart(2, "0"); };
  const dura = (h) => { const mm = Math.max(0, Math.round(h * 60)); return mm >= 60 ? Math.floor(mm / 60) + " h " + String(mm % 60).padStart(2, "0") : mm + " min"; };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  /* un nombre que quepa en el visor: hasta 14 letras, cortando por palabra */
  const corto = (s, n) => { s = String(s).replace(/[\s+·-]+$/, "").trim(); if (s.length <= n) return s; const w = s.slice(0, n + 1).split(/\s+/); w.pop(); return (w.join(" ") || s.slice(0, n - 1)).replace(/[\s+·-]+$/, "") + (w.length ? "" : "."); };
  const cap = (s) => { s = String(s).toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); };
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const ease = (p) => p * p * (3 - 2 * p);

  /* el sueño marca el principio y el final de la ruta */
  const noches = DIA.filter((e) => e.k === "sleep");
  const WAKE = Math.max(0, ...noches.filter((e) => e.a < 12).map((e) => e.b)) || 7;
  const noche = noches.filter((e) => e.a >= 12)[0] || { a: 23.5, b: 31 };
  const BED = noche.a;
  const dia = DIA.filter((e) => e.k !== "sleep" && e.k !== "punto" && e.b > e.a).sort((a, b) => a.a - b.a);

  /* ---------- la ruta: cochera, una parada por cosa del día, cochera ---------- */
  const GAP = 40;
  /* al despertar, un rato para salir de la cochera aunque lo primero sea justo a esa hora */
  const est = [{ s: -GAP, a: -99, b: Math.min(WAKE, (dia[0] ? dia[0].a : WAKE) - 0.25), dep: true }]
    .concat(dia.map((e, i) => ({ s: i * GAP, a: e.a, b: Math.min(e.b, dia[i + 1] ? dia[i + 1].a : e.b), e })))
    .concat([{ s: dia.length * GAP, a: BED, b: 99, dep: true }]);
  /* dónde está el autobús a una hora: parado en su parada mientras dura; entre una y otra, de camino */
  function camDe(t) {
    for (let k = 0; k < est.length; k++) {
      const p = est[k], q = est[k + 1];
      if (t >= p.a && t <= p.b) return { s: p.s, k, parado: true };
      if (q && t > p.b && t < q.a) return { s: p.s + (q.s - p.s) * ease((t - p.b) / (q.a - p.b)), k, parado: false, p: (t - p.b) / (q.a - p.b) };
    }
    return { s: est[est.length - 1].s, k: est.length - 1, parado: true };
  }

  /* ---------- la cámara: los ojos del conductor ---------- */
  const CX = 300, HY = 150, F = 270, EYE = 2.4, NEAR = 0.9, FAR = 260, ZSTOP = 9;
  const pr = (x, y, z) => [CX + F * x / z, HY + F * (EYE - y) / z];
  /* un polígono en 3D, recortado contra el plano cercano y proyectado */
  function poly(pts, cls, extra) {
    const out = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length], ina = a[2] >= NEAR, inb = b[2] >= NEAR;
      if (ina) out.push(a);
      if (ina !== inb) { const f = (NEAR - a[2]) / (b[2] - a[2]); out.push([a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, NEAR]); }
    }
    if (out.length < 3) return "";
    return '<path class="' + cls + '"' + (extra || "") + ' d="M' + out.map((p) => { const s = pr(p[0], p[1], p[2]); return s[0].toFixed(1) + " " + s[1].toFixed(1); }).join("L") + 'Z"/>';
  }
  function seg(a, b, cls, w) {
    if (a[2] < NEAR && b[2] < NEAR) return "";
    if (a[2] < NEAR) { const f = (NEAR - a[2]) / (b[2] - a[2]); a = [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, NEAR]; }
    if (b[2] < NEAR) { const f = (NEAR - b[2]) / (a[2] - b[2]); b = [b[0] + (a[0] - b[0]) * f, b[1] + (a[1] - b[1]) * f, NEAR]; }
    const p = pr(...a), q = pr(...b), zw = Math.min(a[2], b[2]);
    return '<path class="' + cls + '" style="stroke-width:' + Math.max(0.6, w * F / zw).toFixed(2) + 'px" d="M' + p[0].toFixed(1) + " " + p[1].toFixed(1) + "L" + q[0].toFixed(1) + " " + q[1].toFixed(1) + '"/>';
  }
  const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

  /* ---------- la luz: día, amanecer, atardecer y noche ---------- */
  const mix = (a, b, f) => { const A = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)), B = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16)); return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * f).toString(16).padStart(2, "0")).join(""); };
  function luz(t) {
    const d = clamp(Math.min((t - SOL[0] + 0.5) / 1, (SOL[1] + 0.5 - t) / 1), 0, 1);   // 0 noche · 1 día
    const tw = clamp(1 - Math.abs(Math.min(Math.abs(t - SOL[0]), Math.abs(t - SOL[1]))) / 0.8, 0, 1);   // amanecer/atardecer
    let top = mix("#0b1430", "#4f93d8", d), bot = mix("#1b2a4e", "#bfe0ff", d);
    bot = mix(bot, "#f2a65a", tw * 0.7); top = mix(top, "#6b5aa8", tw * 0.35);
    return { d, top, bot };
  }

  /* ---------- la calle ---------- */
  const tipo = (e) => (e.k === "work" || e.k === "guard" ? "work" : e.k);
  function escena(cam, t, L, ahoraE) {
    const out = [], noche = 1 - L.d;
    out.push('<rect class="ground" x="0" y="' + HY + '" width="600" height="160"/>');
    out.push(poly([[-5.2, 0, NEAR], [3.0, 0, NEAR], [3.0, 0, FAR], [-5.2, 0, FAR]], "road"));
    out.push(poly([[3.0, 0.15, NEAR], [8, 0.15, NEAR], [8, 0.15, FAR], [3.0, 0.15, FAR]], "walk"));
    out.push(poly([[-11, 0.15, NEAR], [-5.2, 0.15, NEAR], [-5.2, 0.15, FAR], [-11, 0.15, FAR]], "walk"));
    const tira = (x0, x1, y, cls) => poly([[x0, y, NEAR], [x1, y, NEAR], [x1, y, FAR], [x0, y, FAR]], cls);
    out.push(tira(2.96, 3.1, 0.16, "kerb-f"), tira(-5.3, -5.16, 0.16, "kerb-f"), tira(2.72, 2.8, 0.011, "edge-f"), tira(-4.98, -4.9, 0.011, "edge-f"));
    /* baldosas de la acera y raya discontinua del carril */
    for (let w = Math.floor(cam / 3) * 3; w < cam + 120; w += 3) {
      const z = w - cam + 3; if (z < NEAR) continue;
      out.push(seg([3.2, 0.16, z], [8, 0.16, z], "walk-l", 0.03));
    }
    for (let w = Math.floor(cam / 6) * 6; w < cam + FAR; w += 6) {
      const z0 = w - cam + 2, z1 = z0 + 3; if (z1 < NEAR) continue;
      out.push(poly([[-1.15, 0.01, z0], [-1.0, 0.01, z0], [-1.0, 0.01, z1], [-1.15, 0.01, z1]], "dash"));
    }
    /* los faros, de noche */
    if (noche > 0.05) out.push(poly([[-1.6, 0.01, 1.2], [1.6, 0.01, 1.2], [4, 0.01, 30], [-4, 0.01, 30]], "beam", ' fill="url(#beam)" style="opacity:' + (noche * 0.55).toFixed(2) + '"'));
    /* los edificios, de lejos a cerca, con sus ventanas (encendidas de noche) */
    const blq = [];
    for (let j = Math.floor((cam - 20) / 13); j * 13 < cam + FAR; j++) {
      for (const lado of [1, -1]) {
        const z0 = j * 13 - cam + 2, z1 = z0 + 10.5; if (z1 < NEAR) continue;
        const h = 5 + Math.floor(hash(j * 7 + (lado > 0 ? 1 : 5)) * 11), x0 = lado > 0 ? 8.4 : -11.4, x1 = lado > 0 ? 15 : -18;
        blq.push({ z0, z1, h, x0, x1, j, lado });
      }
    }
    blq.sort((a, b) => b.z0 - a.z0);
    const cls = ["bld-a", "bld-b", "bld-c", "bld-d"];
    for (const b of blq) {
      const c = cls[Math.floor(hash(b.j * 3 + b.lado) * 4)];
      out.push(poly([[b.x0, 0, b.z0], [b.x0, 0, b.z1], [b.x0, b.h, b.z1], [b.x0, b.h, b.z0]], c));
      if (b.z0 > NEAR) out.push(poly([[b.x0, 0, b.z0], [b.x1, 0, b.z0], [b.x1, b.h, b.z0], [b.x0, b.h, b.z0]], "bld-end"));
      if (b.z0 < 70) for (let y = 1.6; y < b.h - 1.2; y += 2.8) for (let z = b.z0 + 1; z < b.z1 - 1.4; z += 2.4) {
        const on = noche > 0.3 && hash(b.j * 31 + y * 7 + z) > 0.55;
        out.push(poly([[b.x0 - 0.01 * b.lado, y, z], [b.x0 - 0.01 * b.lado, y, z + 1.3], [b.x0 - 0.01 * b.lado, y + 1.4, z + 1.3], [b.x0 - 0.01 * b.lado, y + 1.4, z]], on ? "win-on" : "win"));
      }
    }
    /* farolas */
    for (let w = Math.floor(cam / 25) * 25; w < cam + 160; w += 25) {
      const z = w - cam + 12; if (z < NEAR + 0.5) continue;
      out.push(seg([3.5, 0.15, z], [3.5, 5.2, z], "post", 0.09), seg([3.5, 5.2, z], [2.6, 5.4, z], "post", 0.07));
      const p = pr(2.6, 5.3, z), r = Math.max(0.8, 0.16 * F / z);
      out.push('<circle class="lamp" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + r.toFixed(1) + '"/>');
      if (noche > 0.3) out.push('<circle class="glow" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + (r * 3).toFixed(1) + '" style="opacity:' + (0.25 * noche).toFixed(2) + '"/>');
    }
    /* las paradas: una marquesina y un letrero por cosa del día */
    const paradas = est.filter((p) => p.e).map((p) => ({ p, zc: p.s - cam + ZSTOP })).filter((o) => o.zc > -3 && o.zc < 170).sort((a, b) => b.zc - a.zc);
    for (const { p, zc } of paradas) {
      const on = p.e === ahoraE, z0 = zc - 2.1, z1 = zc + 2.1;
      out.push(poly([[6.3, 0.2, z0], [6.3, 0.2, z1], [6.3, 2.45, z1], [6.3, 2.45, z0]], "sh-glass"));
      out.push(poly([[5.4, 0.45, z0 + 0.6], [6.2, 0.45, z0 + 0.6], [6.2, 0.45, z1 - 0.6], [5.4, 0.45, z1 - 0.6]], "sh-bench"));
      out.push(seg([3.7, 0.15, z0 + 0.1], [3.7, 2.5, z0 + 0.1], "post", 0.06), seg([3.7, 0.15, z1 - 0.1], [3.7, 2.5, z1 - 0.1], "post", 0.06));
      out.push(poly([[3.5, 2.5, z0], [6.5, 2.5, z0], [6.5, 2.5, z1], [3.5, 2.5, z1]], "sh-roof"));
      out.push(poly([[3.5, 2.5, z0], [6.5, 2.5, z0], [6.5, 2.72, z0], [3.5, 2.72, z0]], "sh-edge"));
      out.push(poly([[3.5, 2.5, z0], [3.5, 2.5, z1], [3.5, 2.72, z1], [3.5, 2.72, z0]], "sh-edge"));
      /* el letrero, de cara al autobús: hora y nombre, y una franja del color de lo que es */
      const zb = z0 - 0.5;
      out.push(seg([3.3, 0.15, zb], [3.3, 2.6, zb], "post", 0.07));
      if (zb > NEAR + 0.2) {
        const a = pr(2.0, 3.55, zb), b = pr(4.6, 2.6, zb), w = b[0] - a[0], h = b[1] - a[1], fs = h * 0.42;
        out.push('<g data-open="ev' + dia.indexOf(p.e) + '"' + (on ? ' class="on"' : "") + '>' +
          '<rect class="board' + (on ? " board-on" : "") + '" x="' + a[0].toFixed(1) + '" y="' + a[1].toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="' + (h * 0.12).toFixed(1) + '"/>' +
          '<rect class="lv-' + tipo(p.e) + '" x="' + a[0].toFixed(1) + '" y="' + a[1].toFixed(1) + '" width="' + (w * 0.05).toFixed(1) + '" height="' + h.toFixed(1) + '"/>' +
          (fs > 2.2 ? '<text class="board-h" x="' + (a[0] + w * 0.09).toFixed(1) + '" y="' + (a[1] + h * 0.42).toFixed(1) + '" font-size="' + (fs * 0.72).toFixed(1) + '">' + hhmm(p.e.a) + '</text>' +
            '<text class="board-t" x="' + (a[0] + w * 0.09).toFixed(1) + '" y="' + (a[1] + h * 0.84).toFixed(1) + '" font-size="' + fs.toFixed(1) + '" textLength="' + Math.min(w * 0.86, fs * 0.62 * p.e.t.length).toFixed(1) + '" lengthAdjust="spacingAndGlyphs">' + esc(p.e.t) + '</text>' : "") + "</g>");
      }
    }
    return out.join("");
  }

  /* ---------- la cochera por dentro: de noche estás aquí, de cara a la persiana ---------- */
  function cochera(desplaza, abierta, luzCalle) {
    const zd = 12 - desplaza; if (zd < NEAR + 0.05) return "";
    const X = 4.6, Y = 4.8, o = [];
    o.push(poly([[-X, 0, NEAR], [X, 0, NEAR], [X, 0, zd], [-X, 0, zd]], "g-floor"));
    o.push(poly([[-X, Y, NEAR], [X, Y, NEAR], [X, Y, zd], [-X, Y, zd]], "g-ceil"));
    o.push(poly([[-X, 0, NEAR], [-X, 0, zd], [-X, Y, zd], [-X, Y, NEAR]], "g-wall-l"));
    o.push(poly([[X, 0, NEAR], [X, 0, zd], [X, Y, zd], [X, Y, NEAR]], "g-wall-r"));
    /* la pared del fondo con el hueco de la puerta */
    const P = (x, y) => pr(x, y, zd).map((v) => v.toFixed(1)).join(" ");
    o.push('<path class="g-back" fill-rule="evenodd" d="M' + P(-X, 0) + "L" + P(X, 0) + "L" + P(X, Y) + "L" + P(-X, Y) + "Z M" + P(-3.4, 0) + "L" + P(-3.4, 4.1) + "L" + P(3.4, 4.1) + "L" + P(3.4, 0) + 'Z"/>');
    /* la persiana: baja desde arriba; por la rendija de abajo entra la luz de la calle */
    const yb = 4.1 * abierta;
    if (abierta < 0.995) {
      o.push(poly([[-3.4, yb, zd], [3.4, yb, zd], [3.4, 4.1, zd], [-3.4, 4.1, zd]], "g-door"));
      let s = ""; for (let y = yb + 0.35; y < 4.05; y += 0.35) { const a = pr(-3.4, y, zd), b = pr(3.4, y, zd); s += "M" + a[0].toFixed(1) + " " + a[1].toFixed(1) + "L" + b[0].toFixed(1) + " " + b[1].toFixed(1); }
      o.push('<path class="g-slat" d="' + s + '"/>');
      if (abierta < 0.02) o.push(poly([[-3.4, 0, zd], [3.4, 0, zd], [3.4, 0.05, zd], [-3.4, 0.05, zd]], "g-slit", ' style="opacity:' + (0.4 + 0.5 * luzCalle).toFixed(2) + '"'));
    }
    o.push(poly([[-0.6, Y - 0.01, 6], [0.6, Y - 0.01, 6], [0.6, Y - 0.01, 7], [-0.6, Y - 0.01, 7]], abierta > 0.02 ? "g-lamp-on" : "g-lamp"));
    return o.join("");
  }

  /* ---------- lo que dice el salpicadero ---------- */
  function estado(t) {
    const ahora = dia.filter((e) => t >= e.a && t < e.b).pop(), sig = dia.filter((e) => e.a > t), hechos = dia.filter((e) => e.b <= t);
    return { ahora, sig, previo: hechos[hechos.length - 1], durmiendo: t < est[0].b || t >= BED, saliendo: t >= est[0].b && t < WAKE };
  }
  const gticks = []; for (let h = 0; h <= 10; h++) { const a = Math.PI * (1 - h / 10), r0 = h % 5 ? 30 : 27, r1 = 33; gticks.push("M" + (218 + r0 * Math.cos(a)).toFixed(1) + " " + (378 - r0 * Math.sin(a)).toFixed(1) + "L" + (218 + r1 * Math.cos(a)).toFixed(1) + " " + (378 - r1 * Math.sin(a)).toFixed(1)); }
  $("gticks").innerHTML = '<path class="gauge-tk" d="' + gticks.join("") + '"/>';
  const ga = (h) => Math.PI * (1 - clamp(h, 0, 10) / 10);
  const arc = (h) => { const a = ga(h); return "M180 378 A38 38 0 0 1 " + (218 + 38 * Math.cos(a)).toFixed(1) + " " + (378 - 38 * Math.sin(a)).toFixed(1); };
  $("gfill").setAttribute("d", SUENO.h > 0.05 ? arc(SUENO.h) : "");
  { const a = ga(SUENO.obj); $("gobj").setAttribute("d", "M" + (218 + 31 * Math.cos(a)).toFixed(1) + " " + (378 - 31 * Math.sin(a)).toFixed(1) + "L" + (218 + 43 * Math.cos(a)).toFixed(1) + " " + (378 - 43 * Math.sin(a)).toFixed(1)); }
  { const a = ga(SUENO.h); $("needle").setAttribute("x2", (218 + 30 * Math.cos(a)).toFixed(1)); $("needle").setAttribute("y2", (378 - 30 * Math.sin(a)).toFixed(1)); }
  $("gval").textContent = String(Math.round(SUENO.h * 10) / 10).replace(".", ",") + " de " + SUENO.obj + " h";
  $("tk").textContent = PH ? "PARA HOY · " + PH : "PARA HOY ✓";

  function salpicadero(t, st, c) {
    $("clk").textContent = hhmm(t);
    const nx = st.sig[0];
    $("quedan").textContent = st.durmiendo ? (t >= BED ? "a la cama" : "durmiendo") : st.ahora ? "queda" + (st.ahora.b - t >= 1 ? "n " : " ") + dura(st.ahora.b - t) : (nx ? "libre" : "");
    if (st.durmiendo) {
      $("nxl").textContent = "EN COCHERA";
      $("nxb").textContent = t >= BED ? "A dormir" : "Durmiendo";
      $("nxa").innerHTML = "Sales a las <tspan font-weight=\"800\">" + hhmm(WAKE) + "</tspan>" + (dia[0] ? " · luego " + esc(cap(dia[0].t).slice(0, 10)) : "");
    } else {
      $("nxl").textContent = st.saliendo ? "SALIENDO DE LA COCHERA" : nx ? "PRÓXIMA PARADA" : "FIN DE LÍNEA";
      $("nxb").textContent = nx ? hhmm(nx.a) + "  " + cap(corto(nx.t, 13)) : "Cochera · " + hhmm(BED);
      $("nxa").innerHTML = st.ahora ? 'Ahora: <tspan font-weight="800">' + esc(cap(st.ahora.t).slice(0, 14)) + "</tspan> · hasta " + hhmm(st.ahora.b)
        : 'Ahora: <tspan font-weight="800">libre</tspan>' + (nx ? " · llegas en " + dura(nx.a - t) : "");
    }
    $("mir").textContent = st.previo ? "✓ " + hhmm(st.previo.a) + " " + cap(st.previo.t).slice(0, 12) : (st.durmiendo ? "" : "salida " + hhmm(WAKE));
    /* la línea de hoy: una bolita por parada y el autobús donde va */
    const n = dia.length, x = (i) => 150 + (400 * (i + 0.5)) / Math.max(1, n);
    let r = '<path class="strip-l" d="M' + x(0) + ' 22H' + x(n - 1) + '"/>';
    dia.forEach((e, i) => { r += '<circle class="' + (e.b <= t ? "st-done" : e === st.sig[0] || e === st.ahora ? "st-next" : "st-dot") + '" cx="' + x(i).toFixed(1) + '" cy="22" r="' + (e === st.ahora ? 5 : 3.6) + '"/>'; });
    const bi = clamp((c.s / GAP), -0.5, n - 0.5);
    r += '<path class="st-bus" d="M' + (x(bi) - 6).toFixed(1) + ' 15h12v7h-12z"/>';
    $("route").innerHTML = r;
  }

  /* ---------- la vida ---------- */
  let AHORA = HT ? Math.min(23.99, +HT[1]) : null;
  if (VIVO && AHORA != null) { const t0 = AHORA; setInterval(() => { const nuevo = Math.min(23.99, t0 + (Date.now() - CARGA) / 36e5); const sigue = target === AHORA; AHORA = nuevo; if (sigue) { target = AHORA; run(); } }, 30000); }
  let t = AHORA != null ? AHORA : 10.4, target = t, frame = 0, last = 0, touring = AHORA == null, visible = false, idle = 0, clock = 0, toastT = 0;
  const PARADAS = [5, 7.1, 7.6, 10.4, 15.4, 16.4, 18, 19.5, 21, 22.8, 23.6];
  function draw(dt) {
    const L = luz(t), c = camDe(t), st = estado(t);
    $("sky0").setAttribute("stop-color", L.top); $("sky1").setAttribute("stop-color", L.bot);
    $("stars").innerHTML = L.d < 0.6 ? Array.from({ length: 26 }, (_, i) => '<circle cx="' + (40 + hash(i) * 520).toFixed(0) + '" cy="' + (52 + hash(i + 50) * 90).toFixed(0) + '" r="' + (0.6 + hash(i + 9) * 0.9).toFixed(1) + '" fill="#e9f2ff" opacity="' + ((1 - L.d) * 0.8).toFixed(2) + '"/>').join("") : "";
    $("scene").innerHTML = escena(c.s, t, L, st.ahora);
    /* la cochera: de noche estás dentro; al despertar sube la persiana y sales; al acostarte, vuelves */
    let g = "";
    if (c.k === 0) {
      const p = c.parado ? 0 : c.p, abre = clamp(p / 0.3, 0, 1), sale = c.parado ? 0 : (c.s - est[0].s);
      g = cochera(sale, abre, L.d);
    } else if (t >= BED || (c.k === est.length - 2 && !c.parado && c.p > 0.88)) {
      const fade = t >= BED ? 1 : clamp((c.p - 0.88) / 0.12, 0, 1), cierra = t >= BED ? clamp(1 - (t - BED) / 0.2, 0, 1) : 1;
      g = '<g style="opacity:' + fade.toFixed(2) + '">' + cochera(0, cierra, L.d) + "</g>";
    }
    $("garage").innerHTML = g;
    salpicadero(t, st, c);
    svg.setAttribute("aria-valuetext", hhmm(t) + " · " + (st.ahora ? cap(st.ahora.t) + " hasta las " + hhmm(st.ahora.b) : st.durmiendo ? "en la cochera" : "libre"));
  }
  function tick(now) {
    const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60; last = now;
    if (touring) { clock += dt; target = PARADAS[Math.floor(clock / 3) % PARADAS.length]; }
    t = still.matches ? target : t + (target - t) * (1 - Math.exp(-dt / 0.5));
    if (Math.abs(target - t) < 0.001) t = target;
    if (toastT > 0) { toastT -= dt; if (toastT <= 0) $("toast").style.display = "none"; }
    draw(dt);
    frame = visible && (touring || t !== target || toastT > 0) ? requestAnimationFrame(tick) : 0;
  }
  const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
  const steer = (to) => { touring = false; target = clamp(to, 0, 23.99); clearTimeout(idle); idle = setTimeout(() => { if (AHORA != null) target = AHORA; else touring = !still.matches; run(); }, 5000); run(); };
  new IntersectionObserver((es) => { visible = es[es.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(svg);
  if (still.matches) touring = false;
  /* arrastrar a lo ancho mueve la hora; tocar un letrero, el visor, el depósito o la máquina abre lo suyo */
  let down = null;
  svg.addEventListener("pointerdown", (ev) => { down = { x: ev.clientX, t: target, moved: false }; });
  svg.addEventListener("pointermove", (ev) => {
    if (!down) return; const dx = ev.clientX - down.x, w = svg.getBoundingClientRect().width;
    if (Math.abs(dx) > 6) down.moved = true; if (down.moved) steer(down.t - dx / w * 10);
  });
  const toast = (s) => { $("toastt").textContent = s; $("toast").style.display = ""; toastT = 2.2; run(); };
  svg.addEventListener("pointerup", (ev) => {
    const d = down; down = null; if (!d || d.moved) return;
    const el = ev.target.closest && ev.target.closest("[data-open]"); if (!el) return;
    const k = el.getAttribute("data-open"), st = estado(t);
    let e = null, msg = "";
    if (/^ev\d+$/.test(k)) e = dia[+k.slice(2)];
    else if (k === "proxima") e = st.sig[0] || null;
    else if (k === "atras") e = st.previo || null;
    if (e) msg = "abriría: " + cap(e.t) + " · " + hhmm(e.a);
    else if (k === "sueno") msg = "abriría: tu sueño";
    else if (k === "parahoy") msg = "abriría: Para hoy";
    if (!msg) return;
    if (EMBEBIDO) { try { window.parent.postMessage({ hoy: e ? { i: e.i, a: e.a } : { abrir: k } }, location.origin); } catch (er) {} }
    else toast(msg);
  });
  svg.addEventListener("pointerleave", () => { down = null; });
  svg.addEventListener("keydown", (ev) => { const d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[ev.key]; if (!d) return; ev.preventDefault(); steer(Math.round(target * 4) / 4 + d * 0.25); });
  draw(0);
})();
</script>
</body>
</html>
