<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tu ruta de hoy</title>
<!-- El conductor suelto (maqueta): el mismo módulo que usa la app, con un día de ejemplo o el que llegue
     en la dirección: #d=[{a,b,t,k}…]&s=7.5/8&t=10.4&sol=7/18.6&ph=2&claro -->
<style>html,body{margin:0;background:#070b14;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:660px;margin:14px auto;padding:0 8px}</style>
<script src="conductor.js"></script>
</head>
<body>
<div class="wrap" id="w"></div>
<script>
(function () {
  let DIA = [
    { a: 0, b: 6.75, t: "DORMIR", k: "sleep" }, { a: 6.75, b: 7.25, t: "Desayuno", k: "meal", m: "meal", h: 1 },
    { a: 8, b: 15, t: "Trabajo", k: "work" }, { a: 11, b: 11.5, t: "Almuerzo", k: "meal", m: "meal" },
    { a: 15.17, b: 15.75, t: "Comida", k: "meal", m: "meal" }, { a: 17.5, b: 18.75, t: "Gym fuerza", k: "gym", m: "gym" },
    { a: 19.25, b: 19.75, t: "Cena", k: "meal", m: "meal" }, { a: 20, b: 22.17, t: "Lloretazo", k: "plan" },
    { a: 22.67, b: 30.75, t: "A DORMIR", k: "sleep" },
  ];
  const H = location.hash, m = (re) => re.exec(H);
  if (m(/[#&]d=([^&]+)/)) try { DIA = JSON.parse(decodeURIComponent(m(/[#&]d=([^&]+)/)[1])); } catch (e) {}
  const s = m(/[#&]s=([0-9.]+)\/([0-9.]+)/), sol = m(/[#&]sol=([0-9.]+)\/([0-9.]+)/), t = m(/[#&]t=([0-9.]+)/), ph = m(/[#&]ph=([0-9]+)/);
  const dia = [], noches = [];
  DIA.forEach((e, i) => { if (e.k === "sleep") noches.push({ a: e.a, b: e.b, t: e.t === "SIESTA" ? "siesta" : "noche" }); else dia.push(Object.assign({ i: e.i != null ? e.i : i }, e)); });
  const c = window.Conductor.crea({ onAbrir: (o) => console.log("abriría", JSON.stringify(o)) });
  document.getElementById("w").appendChild(c.el);
  c.actualiza({ dia, noches, modo: "hoy", ahora: t ? +t[1] : 10.4, vivo: false, sueno: s ? { h: +s[1], obj: +s[2] } : { h: 7, obj: 8 },
    comida: { kc: 1240, obj: 2340, pr: 72, prObj: 140 }, sol: sol ? [+sol[1], +sol[2]] : [7, 18.6], ph: ph ? +ph[1] : 2,
    senales: [{ t: 16.67, txt: "Último café", ico: "☕" }], pendiente: [], manana: 6.75, claro: /[#&]claro/.test(H) });
})();
</script>
</body>
</html>
